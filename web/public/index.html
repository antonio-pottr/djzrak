<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kvaliteta zraka — Đakovo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Editorial layout: a sentence answers "how's the air?", the PM2.5 card backs it with the
     number, and everything below shows the working. Serif for headings and the big figure. */
  :root {
    color-scheme: light dark;
    --serif: Fraunces, Georgia, serif;
    --sans: Inter, system-ui, sans-serif;

    --bg: #faf8f4;
    --surface: #ffffff;
    --text: #1d1b18;
    --muted: #6b665d;
    --rule: #e6e1d8;
    --line: #2d5b8a;
    --grid: #ece7de;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --surface: #1f1d1a;
      --text: #efebe4;
      --muted: #a39d92;
      --rule: #34302b;
      --line: #8fb8e3;
      --grid: #2a2723;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* The UA's [hidden] rule covers HTML only, so the chart's hover marker needs its own. */
  svg [hidden] { display: none; }

  body { margin: 0 auto; max-width: 760px; padding: 24px clamp(16px, 4vw, 32px) 48px;
         background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans);
         -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }

  .mast { display: flex; justify-content: space-between; align-items: center; gap: 12px;
          border-bottom: 1px solid var(--rule); padding-bottom: 12px; color: var(--muted); font-size: 13px; }
  .mast b { color: var(--text); font-weight: 600; letter-spacing: .02em; }
  .mast .actions { display: flex; gap: 6px; flex: none; }
  .link { background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  .link:hover { background: var(--surface); }
  .link:disabled { opacity: .5; cursor: default; }

  /* Hero: the sentence, the level-coloured PM2.5 card, and how long ago it was measured.
     The tone is one IQAir band colour in both themes; test.mjs holds each pair to WCAG AA. */
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(32px, 6.5vw, 52px);
       line-height: 1.1; margin: 28px 0 16px; letter-spacing: -.01em; text-wrap: balance; }
  h1 mark { background: var(--tone-bg); color: var(--tone-ink); padding: 0 .18em; border-radius: .12em;
            -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .card { background: var(--tone-bg); color: var(--tone-ink); border-radius: 12px; padding: 20px 22px; }
  .kicker { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
  .big { font-family: var(--serif); font-variant-numeric: tabular-nums lining-nums;
         font-size: clamp(72px, 20vw, 128px); line-height: .9; letter-spacing: -.03em; }
  .big small { font-family: var(--sans); font-size: 16px; letter-spacing: 0; opacity: .7; margin-left: 8px; }
  #aqi { font-size: 14px; margin-top: 12px; opacity: .85; font-variant-numeric: tabular-nums; }
  /* A quiet footnote to the card, right-aligned under its bottom-right corner. Kept light by size,
     not opacity: --muted is already the lightest grey that holds WCAG AA on this background. */
  #measured { margin: 6px 2px 0 0; font-size: 11px; color: var(--muted); text-align: right; }

  /* The level scale sits right under the card it explains: a bare colour bar with a marker, its
     level names left to the definitions that fold out below. 20px clears the marker, which pokes
     6px above the bar. */
  .bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; position: relative; height: 10px; margin-top: 20px; }
  .bar span { border-radius: 2px; }
  #marker { position: absolute; top: -6px; width: 4px; height: 22px; background: var(--text);
            border-radius: 2px; transform: translateX(-50%); box-shadow: 0 0 0 2px var(--bg); }
  details { font-size: 13px; color: var(--muted); margin: 14px 0 0; }
  details summary { cursor: pointer; }
  details table { width: 100%; border-collapse: collapse; margin: 10px 0; font-variant-numeric: tabular-nums; color: var(--text); }
  details th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 4px 8px; }
  details td { padding: 6px 8px; border-top: 1px solid var(--rule); }
  details th:last-child, details td:last-child { text-align: right; }
  details .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  details p { margin: 0; }

  /* Secondary readings: one row of four; on phones two rows of two, so the air pair and the
     weather pair stay together. The rule sets them apart from the PM2.5 block above. */
  .sec { display: grid; grid-template-columns: repeat(4, 1fr); margin: 24px 0 0; padding: 0;
         border-top: 1px solid var(--rule); }
  .sec div { padding: 10px 16px 0 0; }
  @media (max-width: 560px) { .sec { grid-template-columns: 1fr 1fr; } }
  .sec dt { font-size: 13px; color: var(--muted); }
  .sec dd { margin: 0; font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .sec .arrow { display: inline-block; color: var(--muted); }

  h2 { font-family: var(--serif); font-weight: 600; font-size: 20px; margin: 40px 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

  /* Every sensor in one table: now, the day's range, the week's shape. */
  .tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .tbl thead th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted);
                  padding: 6px 8px; border-bottom: 1px solid var(--text); }
  .tbl td, .tbl tbody th { padding: 10px 8px; border-bottom: 1px solid var(--rule); vertical-align: middle; text-align: left; }
  .tbl tbody th { font-weight: 600; }
  .tbl tr.row { cursor: pointer; }
  .tbl tr.row:hover > *, .tbl tr.on > * { background: var(--surface); }
  .tbl tr.on > th { box-shadow: inset 3px 0 var(--line); }
  #th-now { text-align: right; }
  .tbl .now { font-size: 17px; font-weight: 500; white-space: nowrap; text-align: right; }
  .tbl .rng { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .tbl svg { width: 110px; height: 26px; display: block; }
  .tbl td.info { width: 1%; }
  .about { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 50%;
           background: none; color: var(--muted); cursor: pointer; }
  .about:hover { background: var(--rule); }
  .about svg { width: 18px; height: 18px; fill: currentColor; }
  .tbl tr.expl td { color: var(--muted); font-size: 13px; background: var(--surface); padding: 4px 8px 14px; }
  @media (max-width: 560px) { .tbl .spark, .tbl .rng { display: none; } }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 10px; }
  .tabs button { border: 1px solid var(--rule); background: none; border-radius: 999px; padding: 2px 12px;
                 font-size: 13px; cursor: pointer; color: var(--muted); }
  .tabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  #chartwrap { position: relative; background: var(--surface); border: 1px solid var(--rule);
               border-radius: 8px; padding: 12px 8px 4px; }
  /* pan-y keeps vertical page scrolling while horizontal drags read the chart */
  #chart { width: 100%; height: 240px; display: block; touch-action: pan-y; }
  #tip { position: absolute; pointer-events: none; transform: translate(-50%, -100%);
         background: var(--text); color: var(--bg); font-size: 12px; line-height: 1.3;
         padding: 6px 10px; border-radius: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #tip b { display: block; font-size: 14px; font-weight: 500; }

  iframe { display: block; width: 100%; height: clamp(300px, 55vh, 400px);
           border: 1px solid var(--rule); border-radius: 8px; }
  /* Contact: a plain surface panel like the chart's, with a normal section heading, and a pill
     button styled like the chart's active tab. */
  .pitch { margin: 40px 0 0; padding: 20px 22px; background: var(--surface);
           border: 1px solid var(--rule); border-radius: 8px; }
  .pitch h2 { margin: 0 0 4px; }
  .pitch p { margin: 0 0 16px; color: var(--muted); max-width: 38em; }
  .cta { display: inline-block; padding: 4px 14px; border-radius: 999px; font-size: 13px;
         background: var(--text); color: var(--bg); text-decoration: none; }
  .cta:hover { opacity: .85; }
  .cta:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
  footer { margin-top: 32px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--rule); padding-top: 12px; }
  footer p { margin: 0 0 6px; }
</style>
</head>
<body>
<!-- Each block below is self-contained: move, copy or delete one as a whole. JS finds its
     parts by id, so a copy needs its ids renamed or the original removed. -->

<!-- Masthead: brand, when the reading was taken, refresh and language buttons -->
<header class="mast" id="masthead">
  <span><b id="brand"></b> · <span id="stamp"></span></span>
  <span class="actions"><button class="link" id="refresh"></button><button class="link" id="lang"></button></span>
</header>

<!-- Hero: the sentence, the level-coloured PM2.5 card, how long ago it was measured -->
<section id="hero">
  <h1 id="headline" aria-live="polite"></h1>
  <div class="card">
    <div class="kicker">PM2.5</div>
    <div class="big"><span id="pm25">–</span><small>µg/m³</small></div>
    <div id="aqi"></div>
  </div>
  <p id="measured"></p>
</section>

<!-- Level scale: colour bar with marker, fold-out definitions -->
<section id="scale">
  <div class="bar" id="bar" role="img"><i id="marker" hidden></i></div>
  <details>
    <summary id="scale-more"></summary>
    <table>
      <thead><tr><th id="col-level"></th><th id="col-aqi"></th><th id="col-pm"></th></tr></thead>
      <tbody id="scale-rows"></tbody>
    </table>
    <p id="scale-note"></p>
  </details>
</section>

<!-- Readings: temperature, humidity, wind, pressure (the starred two are explained in the footer) -->
<section id="readings">
  <dl class="sec" id="summary"></dl>
</section>

<!-- Sensors table: every sensor's now, 24 h range, week sparkline -->
<section id="sensors">
  <h2 id="sec-sensors"></h2>
  <p class="sub" id="sec-sensors-note"></p>
  <table class="tbl">
    <thead><tr><th id="th-sensor"></th><th id="th-now"></th><th class="rng" id="th-day"></th><th class="spark" id="th-week"></th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</section>

<!-- History chart: sensor tabs and the week's line -->
<section id="history">
  <h2 id="sec-history"></h2>
  <p class="sub" id="sec-history-note"></p>
  <div class="tabs" id="tabs" role="group"></div>
  <div id="chartwrap">
    <svg id="chart" role="img"></svg>
    <div id="tip" hidden></div>
  </div>
</section>

<!-- Windy map -->
<section id="windy">
  <h2 id="sec-map"></h2>
  <p class="sub" id="sec-map-note"></p>
  <iframe id="map" loading="lazy"
    src="https://embed.windy.com/embed2.html?lat=45.308&lon=18.410&detailLat=45.308&detailLon=18.410&zoom=9&overlay=wind&marker=true&metricTemp=%C2%B0C"></iframe>
</section>

<!-- Contact: hobby-project disclaimer and a "get in touch" button -->
<section id="contact" class="pitch">
  <h2 id="contact-title"></h2>
  <p id="contact-text"></p>
  <a class="cta" id="contact-cta"><span id="contact-label"></span> <span aria-hidden="true">→</span></a>
</section>

<!-- Footer: sensor and data credits, and what the starred readings are -->
<footer id="credits">
  <p id="footer"></p>
  <p id="model-note"></p>
</footer>

<script type="module">
import { aqi, usAqi, CATEGORIES } from "./aqi.js";
import { niceRange } from "./scale.js";

// Where the contact section's button sends mail. Public on the page.
const CONTACT_EMAIL = "hellopottr@gmail.com";

// mdi:information-outline, Material Design Icons (Pictogrammers, Apache-2.0).
const INFO_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11,9H13V7H11M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M11,17H13V11H11V17Z"/></svg>`;

const num = (v, digits = 1) =>
  typeof v === "number" && Number.isFinite(v) ? v.toFixed(digits) : "—";

// Croatian is the default; a viewer's choice is remembered per browser.
const LANGS = ["hr", "en"];
const STORED = "lang";
const readLang = () => {
  try {
    const saved = localStorage.getItem(STORED);
    return LANGS.includes(saved) ? saved : null;
  } catch {
    return null; // private window, or site data blocked
  }
};

let lang = readLang() ?? LANGS[0];
let t; // the loaded translation table
let latest = null; // last /api/data payload, so switching language needs no refetch
// Why the last load failed, kept because the headline belongs to render() and a failed load
// never reaches it — without this, switching language leaves the error in the previous language.
let failure = null; // { net: true } | { status: number }
let series = "pm25"; // which sensor the history chart shows
let open = null; // which sensor's explanation is unfolded in the table
let weather = null; // Open-Meteo "current" block, or null when it failed

const fill = (template, values) =>
  template.replace(/\{(\w+)\}/g, (_, key) => values[key]);

const setText = (id, text) => { document.getElementById(id).textContent = text; };

// Entity set comes from air-quality-sensor.yaml: SPS30 particulates, SGP4x, SHT4x.
// Keys match SENSORS in src/db.js (test.mjs checks); names are keys into sensors.*.
const SENSORS = [
  ["pm25", "µg/m³", 2],
  ["pm10", "µg/m³", 2],
  ["pm1", "µg/m³", 2],
  ["voc", "", 0],
  ["nox", "", 0],
  ["temp", "°C", 1],
  ["hum", "%", 0],
];

// Particulate mass starts its chart axis at zero; the rest (below-zero temperatures, an
// index hovering near 100) fit their own range. Tooltips never need more than one decimal.
const UNITS = Object.fromEntries(SENSORS.map(([key, unit, digits]) =>
  [key, { unit, digits, tipDigits: Math.min(digits, 1), zero: unit === "µg/m³" }]));

const withUnit = (key, v) => {
  const { unit, digits } = UNITS[key];
  return `${num(v, digits)}${unit ? ` ${unit}` : ""}`;
};

// The Worker sends history as columns ({ ts: [...], pm25: [...] }) with null for a missing
// reading; the table and chart want [{ ts, v }] with the gaps dropped.
const points = (key) => {
  const history = latest?.history;
  if (!history?.[key]) return [];
  return history.ts.map((ts, i) => ({ ts, v: history[key][i] }))
    .filter((p) => typeof p.v === "number");
};

const lastDay = (pts) => pts.filter((p) => p.ts > Date.now() - 864e5);

const range = (pts, digits) => {
  if (!pts.length) return "—";
  const values = pts.map((p) => p.v);
  return `${num(Math.min(...values), digits)}–${num(Math.max(...values), digits)}`;
};

// The bar gives each level an equal slot, so the marker needs each level's AQI span. Derived
// from CATEGORIES so a breakpoint change moves the bar too; the AQI scale stops at 500.
const AQI_EDGES = [0, ...CATEGORIES.slice(0, -1).map((c) => usAqi(c.max)), 500];

const markerPercent = (index) => {
  const band = AQI_EDGES.findIndex((_, i) => index <= AQI_EDGES[i + 1]);
  const [lo, hi] = [AQI_EDGES[band], AQI_EDGES[band + 1]];
  return ((band + (index - lo) / (hi - lo)) / CATEGORIES.length) * 100;
};

function sparkline(pts) {
  if (pts.length < 2) return "";
  const W = 110, H = 26, PAD = 2;
  const values = pts.map((p) => p.v);
  const lo = Math.min(...values), span = Math.max(...values) - lo || 1;
  const line = pts.map((p, i) =>
    `${((i / (pts.length - 1)) * W).toFixed(1)},${(PAD + (1 - (p.v - lo) / span) * (H - 2 * PAD)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${line}" fill="none" stroke="var(--line)" stroke-width="1.25" vector-effect="non-scaling-stroke"/></svg>`;
}

// Static chrome. Runs on load and again on every language switch.
function applyStrings() {
  document.documentElement.lang = lang;
  document.title = t.title;
  setText("brand", t.brand);
  setText("refresh", t.refresh);
  const langButton = document.getElementById("lang");
  langButton.textContent = t.switch.label;
  langButton.setAttribute("aria-label", t.switch.aria);

  setText("model-note", t.modelNote);
  document.getElementById("bar").setAttribute("aria-label", t.scale.aria);
  setText("scale-more", t.scale.more);
  setText("col-level", t.scale.colLevel);
  setText("col-aqi", t.scale.colAqi);
  setText("col-pm", t.scale.colPm);
  setText("scale-note", t.scale.note);
  drawScale();

  setText("sec-sensors", t.sections.sensors);
  setText("sec-sensors-note", t.sections.sensorsNote);
  setText("th-sensor", t.table.sensor);
  setText("th-now", t.table.now);
  setText("th-day", t.table.day);
  setText("th-week", t.table.week);

  setText("sec-history", fill(t.sections.history, { name: t.sensors[series] }));
  setText("sec-history-note", t.sections.historyNote);
  document.getElementById("tabs").setAttribute("aria-label", t.chart.tabs);
  svg.setAttribute("aria-label", fill(t.chart.aria, { name: t.sensors[series] }));

  setText("sec-map", t.sections.map);
  setText("sec-map-note", t.sections.mapNote);
  document.getElementById("map").title = t.map.title;
  setText("contact-title", t.contact.title);
  setText("contact-text", t.contact.text);
  setText("contact-label", t.contact.button);
  document.getElementById("contact-cta").href =
    `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(t.contact.subject)}`;
  setText("footer", t.footer);
}

// The colour bar and the definitions table both derive from CATEGORIES, so a breakpoint change
// updates both. Only the open-ended top band needs special casing.
function drawScale() {
  document.getElementById("bar").replaceChildren(
    document.getElementById("marker"),
    ...CATEGORIES.map((band) => Object.assign(document.createElement("span"), { style: `background:${band.bg}` })),
  );
  document.getElementById("scale-rows").innerHTML = CATEGORIES
    .map((band, i) => {
      const pmLo = i === 0 ? 0 : Number((CATEGORIES[i - 1].max + 0.1).toFixed(1));
      const openEnded = !Number.isFinite(band.max);
      return `<tr>
        <td><span class="swatch" style="background:${band.bg}"></span>${t.levels[band.key]}</td>
        <td>${openEnded ? `${usAqi(pmLo)}+` : `${usAqi(pmLo)}–${usAqi(band.max)}`}</td>
        <td>${openEnded ? `${pmLo}+` : `${pmLo}–${band.max}`}</td>
      </tr>`;
    })
    .join("");
}

// Direction is where the wind comes from, named on 8 points; the arrow points where it blows,
// as on Windy's map.
function windText() {
  const from = weather?.wind_direction_10m;
  // Third-party data goes into innerHTML below, so anything but a number stops here.
  if (!Number.isFinite(from)) return "—";
  const name = t.compass[Math.round(from / 45) % 8];
  return `${num(weather.wind_speed_10m, 0)} kt <span class="arrow" aria-hidden="true"
    style="transform: rotate(${from + 180}deg)">↑</span> ${name}`;
}

// "4 minutes ago", in the page's language. The page never polls, so a minute timer below keeps
// this from going stale in a tab left open.
function renderMeasured() {
  const updated = latest?.updated;
  if (!updated) return setText("measured", "");
  const minutes = Math.round((Date.now() - updated) / 6e4);
  if (minutes < 1) return setText("measured", t.measuredNow);
  const rtf = new Intl.RelativeTimeFormat(t.locale, { numeric: "auto" });
  const ago = minutes < 60 ? rtf.format(-minutes, "minute")
    : minutes < 1440 ? rtf.format(-Math.round(minutes / 60), "hour")
    : rtf.format(-Math.round(minutes / 1440), "day");
  setText("measured", fill(t.measured, { time: ago }));
}
setInterval(() => { if (t) renderMeasured(); }, 6e4);

function renderHero({ now, updated }) {
  const pm = now?.pm25;
  const cat = aqi(pm);
  // On body, not the hero, so the headline and card keep their tone wherever they are moved.
  document.body.style.setProperty("--tone-bg", cat.bg);
  document.body.style.setProperty("--tone-ink", cat.ink);

  const headline = document.getElementById("headline");
  if (cat.key === "noData") {
    headline.textContent = t.noReadings;
  } else {
    const [before, after] = t.headline.split("{level}");
    const mark = Object.assign(document.createElement("mark"), { textContent: t.verdict[cat.key] });
    headline.replaceChildren(before, mark, after);
  }

  setText("pm25", num(pm, 2));
  const index = usAqi(pm);
  setText("aqi", index === null ? "" : fill(t.usAqi, { value: index }));

  const marker = document.getElementById("marker");
  marker.hidden = index === null;
  if (index !== null) marker.style.left = `${markerPercent(index)}%`;

  document.getElementById("summary").innerHTML = [
    [t.sensors.temp, withUnit("temp", now?.temp)],
    [t.sensors.hum, withUnit("hum", now?.hum)],
    // The asterisk points to #model-note in the footer: these two are modelled, not measured.
    [`${t.wind}*`, windText()],
    [`${t.pressure}*`, Number.isFinite(weather?.pressure_msl) ? `${num(weather.pressure_msl, 0)} hPa` : "—"],
  ].map(([label, value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`).join("");

  renderMeasured();
  setText("stamp", updated
    ? fill(t.updated, { time: new Date(updated).toLocaleString(t.locale,
      { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) })
    : t.noReadings);
}

function renderRows({ now }) {
  document.getElementById("rows").innerHTML = SENSORS.map(([key, , digits]) => {
    const pts = points(key);
    const row = `<tr class="row${key === series ? " on" : ""}" data-key="${key}">
      <th scope="row">${t.sensors[key]}</th>
      <td class="now">${withUnit(key, now?.[key])}</td>
      <td class="rng">${range(lastDay(pts), digits)}</td>
      <td class="spark">${sparkline(pts)}</td>
      <td class="info"><button class="about" data-about="${key}" aria-expanded="${open === key}"
        aria-label="${fill(t.about.open, { name: t.sensors[key] })}">${INFO_ICON}</button></td>
    </tr>`;
    return open === key ? `${row}<tr class="expl"><td colspan="5">${t.about[key]}</td></tr>` : row;
  }).join("");
}

function renderTabs() {
  document.getElementById("tabs").innerHTML = SENSORS.map(([key]) =>
    `<button data-key="${key}" aria-pressed="${key === series}">${t.sensors[key]}</button>`).join("");
}

function render() {
  renderHero(latest);
  renderRows(latest);
  renderTabs();
  drawChart();
}

const svg = document.getElementById("chart");
const tip = document.getElementById("tip");
const H = 240;
const PAD = { top: 26, right: 8, bottom: 26, left: 36 };

let chartPoints = [];
let plot = null; // { x(i), y(v), i(px) }

function drawChart() {
  hideTip();
  const W = svg.clientWidth || 560;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  chartPoints = points(series);
  if (chartPoints.length < 2) {
    plot = null;
    svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="14"
      fill="currentColor" opacity=".5">${t?.chart.empty ?? ""}</text>`;
    return;
  }

  // 1 unit of headroom so the week's peak (and trough) never touches the edge.
  const { unit, zero } = UNITS[series];
  const values = chartPoints.map((p) => p.v);
  const { step, bottom, top } = niceRange(zero ? 0 : Math.min(...values) - 1, Math.max(...values) + 1);
  const w = W - PAD.left - PAD.right;
  const h = H - PAD.top - PAD.bottom;
  const n = chartPoints.length;

  plot = {
    x: (i) => PAD.left + (i / (n - 1)) * w,
    y: (v) => PAD.top + h - ((v - bottom) / (top - bottom)) * h,
    i: (px) => Math.min(n - 1, Math.max(0, Math.round(((px - PAD.left) / w) * (n - 1)))),
  };

  const grid = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
    stroke="var(--grid)" stroke-width="1"/>`;
  const label = (x, y, text, anchor) => `<text x="${x}" y="${y}" text-anchor="${anchor}"
    font-size="11" fill="var(--muted)">${text}</text>`;

  let svgText = "";

  // PM2.5 gets its air quality levels shaded behind the line, so the week reads as levels.
  if (series === "pm25") {
    const clampY = (v) => Math.max(PAD.top, Math.min(PAD.top + h, plot.y(v)));
    let lo = 0;
    for (const band of CATEGORIES) {
      if (lo >= top) break;
      const y1 = clampY(Math.min(band.max, top));
      svgText += `<rect x="${PAD.left}" y="${y1}" width="${w}" height="${clampY(lo) - y1}"
        fill="${band.bg}" opacity=".18"/>`;
      lo = band.max;
    }
  }

  // Unit sits above the y axis.
  svgText += label(PAD.left - 4, 12, unit, "start");

  for (let v = bottom; v <= top + 1e-9; v += step) {
    const y = plot.y(v);
    svgText += grid(PAD.left, y, W - PAD.right, y) + label(PAD.left - 8, y + 4, +v.toFixed(1), "end");
  }

  // Five dated ticks, each with a vertical gridline.
  const every = Math.ceil((n - 1) / 4);
  const fmt = { day: "numeric", month: "short" };
  for (let i = 0; i < n; i += every) {
    const x = plot.x(i);
    svgText += grid(x, PAD.top, x, PAD.top + h)
      + label(x, H - 8, new Date(chartPoints[i].ts).toLocaleDateString(t?.locale, fmt), "middle");
  }

  const line = chartPoints.map((p, i) => `${plot.x(i).toFixed(1)},${plot.y(p.v).toFixed(1)}`).join(" ");
  svgText += `
    <polyline points="${line}" fill="none" stroke="var(--line)"
      stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="guide" y1="${PAD.top}" y2="${PAD.top + h}" stroke="var(--muted)"
      opacity=".6" stroke-width="1" hidden/>
    <circle id="dot" r="4.5" fill="var(--line)" stroke="var(--surface)" stroke-width="2" hidden/>`;
  svg.innerHTML = svgText;
}

function hideTip() {
  tip.hidden = true;
  svg.querySelector("#guide")?.setAttribute("hidden", "");
  svg.querySelector("#dot")?.setAttribute("hidden", "");
}

function showTip(event) {
  if (!plot) return;
  const rect = svg.getBoundingClientRect();
  // viewBox units track CSS pixels, except in the instant between a resize and a redraw.
  const px = (event.clientX - rect.left) * (svg.clientWidth / rect.width);
  const i = plot.i(px);
  const point = chartPoints[i];
  const x = plot.x(i);
  const y = plot.y(point.v);

  const guide = svg.querySelector("#guide");
  guide.removeAttribute("hidden");
  guide.setAttribute("x1", x);
  guide.setAttribute("x2", x);

  const dot = svg.querySelector("#dot");
  dot.removeAttribute("hidden");
  dot.setAttribute("cx", x);
  dot.setAttribute("cy", y);

  const { unit, tipDigits } = UNITS[series];
  tip.innerHTML = `<b>${point.v.toFixed(tipDigits)}${unit ? ` ${unit}` : ""}</b>${new Date(point.ts)
    .toLocaleString(t.locale, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}`;
  tip.hidden = false;
  // Clamp so the tooltip never hangs off either edge of the chart card.
  const half = tip.offsetWidth / 2;
  const offset = svg.offsetLeft;
  tip.style.left = `${offset + Math.min(Math.max(x, half), svg.clientWidth - half)}px`;
  tip.style.top = `${svg.offsetTop + y - 10}px`;
}

function selectSeries(key) {
  series = key;
  applyStrings();
  if (latest) render(); else drawChart();
}

document.getElementById("rows").addEventListener("click", (e) => {
  const about = e.target.closest("[data-about]");
  if (about) {
    open = open === about.dataset.about ? null : about.dataset.about;
    renderRows(latest);
    return;
  }
  const row = e.target.closest("tr.row");
  if (!row) return;
  selectSeries(row.dataset.key);
  document.getElementById("sec-history").scrollIntoView({ behavior: "smooth", block: "start" });
});

document.getElementById("tabs").addEventListener("click", (e) => {
  const key = e.target.closest("button")?.dataset.key;
  if (key) selectSeries(key);
});

svg.addEventListener("pointermove", showTip);
svg.addEventListener("pointerdown", showTip);
svg.addEventListener("pointerleave", hideTip);
new ResizeObserver(drawChart).observe(svg);

const showFailure = () => setText("headline",
  failure.net ? t.netError : fill(t.apiError, { status: failure.status }));

async function setLanguage(next) {
  const res = await fetch(`i18n/${next}.json`);
  if (!res.ok) throw new Error(`missing translation file i18n/${next}.json`);
  t = await res.json();
  lang = next;
  try {
    localStorage.setItem(STORED, next);
  } catch { /* nothing to remember it with; the page still works */ }
  applyStrings();
  // The headline holds whichever of the three states we are in, and only render() owns the third.
  if (failure) showFailure();
  else if (latest) render();
  else setText("headline", t.loading);
}

document.getElementById("lang").addEventListener("click", () => {
  setLanguage(LANGS.find((code) => code !== lang));
});

// Wind and pressure aren't measured here: they're the ECMWF model (Windy's default) for
// Đakovo, from Open-Meteo. Pressure is reduced to sea level, as weather reports give it.
const WEATHER_URL = "https://api.open-meteo.com/v1/forecast?latitude=45.308&longitude=18.410"
  + "&current=wind_speed_10m,wind_direction_10m,pressure_msl&wind_speed_unit=kn&models=ecmwf_ifs025";

// An Open-Meteo outage costs only its cells, never the sensor readings.
async function loadWeather() {
  try {
    // Rendering waits on this, so a hung request must not hold up the sensor readings.
    const res = await fetch(WEATHER_URL, { signal: AbortSignal.timeout(5000) });
    if (!res.ok) throw new Error(`Open-Meteo answered ${res.status}`);
    weather = (await res.json()).current;
  } catch (err) {
    console.error("weather", err);
    weather = null;
  }
}

async function load() {
  const weatherLoaded = loadWeather();
  const refresh = document.getElementById("refresh");
  // Disabled rather than hidden, so a second click cannot land and the focus ring stays put.
  refresh.disabled = true;
  failure = null;
  setText("headline", t.loading);

  let res = null;
  try {
    res = await fetch("/api/data");
    if (!res.ok) failure = { status: res.status };
    else latest = await res.json();
  } catch (err) {
    console.error(err);
    // No response object means the request never landed: offline, DNS, CORS, CSP. A response
    // we then failed to parse did land, so that is the Worker's problem, not the network's.
    failure = res ? { status: res.status } : { net: true };
  }

  await weatherLoaded;
  refresh.disabled = false;
  if (failure) return showFailure();
  // Outside every guard: a bug in here must throw for real, not read as an outage.
  render();
}

document.getElementById("refresh").addEventListener("click", load);

await setLanguage(lang);
// No polling: the page shows when its reading was taken, and a refresh fetches a new one.
load();
</script>
</body>
</html>
