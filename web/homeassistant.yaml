# Paste into Home Assistant's configuration.yaml (or split-config equivalents),
# then add `air_ingest_token: "Bearer <the same secret>"` to HA's secrets.yaml.
# HA only ever makes an outbound POST here, so nothing about this exposes HA itself.
#
# Entity IDs come from air-quality-sensor.yaml (SHT4x + SGP4x + SPS30), which is what
# the outdoor unit actually runs. No pressure sensor on that board.

rest_command:
  push_air:
    url: https://air.aloncar-mail.workers.dev/ingest
    method: post
    content_type: application/json
    headers:
      authorization: !secret air_ingest_token
    # float(default=none) renders as JSON null, so one dead chip on the device
    # cannot break the payload for the others. The Worker rejects a null pm25.
    payload: >
      {{ {'pm25': states('sensor.air_quality_sensor_pm2_5')       | float(default=none),
          'pm10': states('sensor.air_quality_sensor_pm10')        | float(default=none),
          'pm1':  states('sensor.air_quality_sensor_pm1_0')       | float(default=none),
          'voc':  states('sensor.air_quality_sensor_voc_index')   | float(default=none),
          'nox':  states('sensor.air_quality_sensor_nox_index')   | float(default=none),
          'temp': states('sensor.air_quality_sensor_temperature') | float(default=none),
          'hum':  states('sensor.air_quality_sensor_humidity')    | float(default=none)
         } | tojson }}

automation:
  - alias: Push air data to Cloudflare
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: template
        value_template: "{{ has_value('sensor.air_quality_sensor_pm2_5') }}"
    actions:
      - action: rest_command.push_air
