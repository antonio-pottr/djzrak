esphome:
  name: climate-sensor
  friendly_name: Climate Sensor

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Climate Sensor Fallback"
    password: !secret ota_password

captive_portal:

# ponytail: pins are the C6 mini default I2C pair, change if your board wires them elsewhere
i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

sensor:
  - platform: scd4x
    co2:
      name: "CO2"
      on_value_range:
        - above: 1000
          then:
            - light.turn_on:
                id: led
                effect: "Blink"
        - below: 1000
          then:
            - light.turn_off: led
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    measurement_mode: low_power_periodic
    temperature_offset: 2.0
    update_interval: 60s

# ponytail: GPIO8 is the onboard WS2812 on most C6 mini boards, change pin if yours differs
light:
  - platform: esp32_rmt_led_strip
    id: led
    name: "Status LED"
    pin: GPIO8
    chipset: WS2812
    rgb_order: GRB
    num_leds: 1
    restore_mode: ALWAYS_OFF
    effects:
      - strobe:
          name: "Blink"
          colors:
            - state: true
              brightness: 50%
              red: 100%
              green: 0%
              blue: 0%
              duration: 500ms
            - state: false
              duration: 500ms
