esphome:
  name: air-quality-sensor
  friendly_name: Air Quality Sensor

# "Bearer" is transport detail, so it lives here rather than inside the secret's
# value — secrets.yaml holds the bare token from `wrangler secret put INGEST_TOKEN`.
substitutions:
  ingest_token: !secret ingest_token

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Air Quality Sensor Fallback"
    password: !secret ota_password

captive_portal:

# ponytail: same C6 mini default I2C pair as climate-sensor.yaml, change if wired elsewhere
i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

http_request:
  # verify_ssl stays on here, unlike the old Sensor.Community push: that one carried
  # only public air data, this one carries the ingest token in a header. esp-idf ships
  # a CA bundle, so no ca_certificate_path is needed for a Cloudflare certificate.
  verify_ssl: true
  timeout: 10s

sensor:
  - platform: sht4x
    temperature:
      name: "Temperature"
      id: temp
    humidity:
      name: "Humidity"
      id: hum
    update_interval: 60s

  - platform: sgp4x
    voc:
      name: "VOC Index"
      id: voc
    nox:
      name: "NOx Index"
      id: nox
      force_update: true
    compensation:
      temperature_source: temp
      humidity_source: hum
    store_baseline: true
    update_interval: 60s

  - platform: sps30
    pm_1_0:
      name: "PM1.0"
      id: pm1
    pm_2_5:
      name: "PM2.5"
      id: pm25
      on_value:
        - script.execute: update_led
        - script.execute: push_reading
    pm_4_0:
      name: "PM4.0"
    pm_10_0:
      name: "PM10"
      id: pm10
    pm_size:
      name: "Typical Particle Size"
    update_interval: 60s


script:
  # Fires from pm_2_5's on_value, the same moment the reading is published to Home
  # Assistant, so the page and HA never disagree. Straight to the Worker: HA is not
  # in the path, and rest_command has no UI.
  # mode: single drops an overlapping run rather than queueing, so a slow or failed
  # POST cannot pile up behind the 60s sensor cycle.
  - id: push_reading
    mode: single
    then:
      - if:
          condition:
            lambda: "return !std::isnan(id(pm25).state);"
          then:
            - http_request.post:
                url: https://air.aloncar-mail.workers.dev/ingest
                capture_response: false
                request_headers:
                  Content-Type: application/json
                  Authorization: "Bearer ${ingest_token}"
                json: |-
                  auto add = [&](const char *key, float v) {
                    if (!std::isnan(v)) root[key] = v;
                  };
                  add("pm25", id(pm25).state);
                  add("pm10", id(pm10).state);
                  add("pm1", id(pm1).state);
                  add("voc", id(voc).state);
                  add("nox", id(nox).state);
                  add("temp", id(temp).state);
                  add("hum", id(hum).state);

# US EPA AQI category colors, driven by PM2.5 (breakpoints per the May 2024 revision)
  - id: update_led
    then:
      - lambda: |-
          float pm = id(pm25).state;
          if (isnan(pm)) { id(led).turn_off().perform(); return; }
          auto call = id(led).turn_on();
          call.set_brightness(0.5);
          if      (pm <=   9.0) call.set_rgb(0.000, 0.894, 0.000);  // Good            #00E400
          else if (pm <=  35.4) call.set_rgb(1.000, 1.000, 0.000);  // Moderate        #FFFF00
          else if (pm <=  55.4) call.set_rgb(1.000, 0.494, 0.000);  // Sensitive grps  #FF7E00
          else if (pm <= 125.4) call.set_rgb(1.000, 0.000, 0.000);  // Unhealthy       #FF0000
          else if (pm <= 225.4) call.set_rgb(0.561, 0.247, 0.592);  // Very unhealthy  #8F3F97
          else                  call.set_rgb(0.494, 0.000, 0.137);  // Hazardous       #7E0023
          call.perform();

# ponytail: GPIO8 is the onboard WS2812 on most C6 mini boards, change pin if yours differs
light:
  - platform: esp32_rmt_led_strip
    id: led
    name: "Status LED"
    pin: GPIO8
    chipset: WS2812
    rgb_order: GRB
    num_leds: 1
    restore_mode: ALWAYS_OFF
    # gamma correction skews orange toward red, which defeats the point of AQI colors
    gamma_correct: 1.0
